<h1>Hello {{user}}, please login</h1>
<p>Name: <input type="text" (keyup)="keyup()" [(ngModel)]="username"></p>
<p>Password: <input type="password" (keyup)="keyup()" [(ngModel)]="password"></p>
<p><button (click)="checkLogin()" 
        [disabled]="disabled">Login</button></p>
<p>{{message}}</p>
<hr/>
@if (attempts.length == 0) {
    <p>History is empty!</p>
} 
@else {
    <ul>
        @for (attempt of attempts; track attempt) {
            <li>User={{attempt.user}}, pwd={{attempt.pwd}}</li>
        }
    </ul>
}
