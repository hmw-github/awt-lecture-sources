<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        #nr {
            width: 40px;
        }
    </style>
</head>

<body>
    <h4>Shopping List</h4>

        <ol id='list'>
        </ol>

        <p>
            <button id="new-button">New Entry</button>
        </p>
        Nr: <input type='number' id='nr'>
        <button id="delete-button">remove entry</button>
</body>
<script>
    var shoppingList = [];
    let articles = ['Milk', 'Butter', 'Fruit', 'Salad'];

    /**
     * TODO: Append a new entry to the shopping list (<ol id="list">).
     *
     * - create a new <li> element
     * - set its text to a random article (use randomArticle(articles))
     * - append the <li> element to the list
     *
     * Hints: document.getElementById(), document.createElement(),
     *        element.textContent, element.appendChild()
     */
    function appendEntry() {
        const ol = document.getElementById('list');
        const newLI = document.createElement('li');
        const newArticle = randomArticle(articles);

        newLI.innerText = newArticle;
        ol.appendChild(newLI);
        shoppingList.push(newArticle);
        storeList();
    }

    async function storeList() {
        try {
            const response = await fetch("http://localhost:3000/shopping-list", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify(shoppingList),
            });

            if (!response.ok) {
                console.error("Error: " + response.status);
                alert(response.status);
            } else {
                alert('Data saved!');
            }
        } catch (err) {
            alert(err);
        }
    }

    /**
     * TODO: Remove the entry whose number the user entered in <input id="nr">.
     *
     * - read the number from the input field
     * - note: the user enters 1..n, but the list's child nodes are indexed 0..n-1
     * - remove the corresponding <li> element from the list
     * - if there is no such entry, show alert('Entry not found!')
     *
     * Hints: input.value, list.childNodes, list.removeChild(), try/catch
     */
    function deleteEntry() {
        const ol = document.getElementById('list');
        const nrField = document.getElementById('nr');
        const nr = nrField.value;

        try {
            const elementToDelete = ol.childNodes[nr-1];
            ol.removeChild(elementToDelete);
            nrField.value = '';
            // delete entry from shoppingList
            shoppingList.splice(nr-1, 1);
            storeList();            
        } catch (err) {
            alert('Entry not found!');
        }
    }

    /**
     * Returns a random article from 'articles' (here named 'list')
    */
    function randomArticle(list) {
        const nr = Math.trunc((Math.random() * list.length)) % list.length;
        return list[nr];
    }

    // establish event listeners new and delete buttons
    document.getElementById('new-button')
    .addEventListener('click', function (event) {
        appendEntry();
    });
    document.getElementById('delete-button')
    .addEventListener('click', function (event) {
        deleteEntry();
    });

    const f = async () => {
        // load the shopping list and populate the OL
        try {
            const response = await fetch("http://localhost:3000/shopping-list");

            if (!response.ok) {
                throw new Error('Server not ready!');                            
            }

            shoppingList = await response.json();

            const OL = document.getElementById('list');        
            shoppingList.forEach((article) => {
                const newLI = document.createElement('li');
                newLI.innerText = article;
                OL.appendChild(newLI);
            });

        } catch (err) {
            alert('Error: ' + err.message);
        }
    };
    f();
</script>

</html>
