<!DOCTYPE html>
<html>
    <head>
        <title>Fetch Demo (async/await)</title>
    </head>
    <body>
        <h3>Fetch Demo (async/await)</h3>
        <p>Fetching data from https://jsonplaceholder.typicode.com/posts</p>
        <output id="result">nothing yet</output>
        <script>
            async function loadPosts() {
                try {
                    // await suspends the function until the promise is resolved
                    const response = await fetch("https://jsonplaceholder.typicode.com/posts");

                    // first step: check response
                    if (!response.ok) {
                        // jump to catch clause
                        throw new Error("HTTP error " + response.status);
                    }

                    // second step: parse and process data
                    const data = await response.json();
                    console.log(data);
                    let postsAsString = '';

                    data.forEach((post) => {
                        postsAsString += `${post.id}: ${post.title}<br>`;
                    });

                    document.getElementById('result').innerHTML = postsAsString;
                } catch (error) {
                    // rejected promises (network errors) and thrown errors end up here
                    console.log(error);
                    document.getElementById('result').innerHTML = error;
                }
            }

            loadPosts();
        </script>
    </body>
</html>
