<script src="./Employee.js"></script>
<script>
/**
 * Describe Anna (from class example) in JSON and store the data in localStorage
 * Load "anna" back in and recreate the Employee object!
 */
var annaJSON = {
  "name": "Anna",
  "age": 21,
  "nr": 4711
};

// store key/value pair in local storage
localStorage.anna = JSON.stringify(annaJSON);

// Load "anna" back in and create the Employee object!
let json = JSON.parse(localStorage.anna); // convert localStorage value (string) to JSON object
let anna = new Employee(json.name, json.age, json.nr);
console.log(anna.toString());
</script>
</html>
