<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo for inline and block elements</title>
    <style>
        div {
            border: 1px solid black;
            display: block;
        }
        span {
            border: 1px solid red;
            display: inline-block;
            width: 100px;
        }
    </style>
</head>
<body>
    <div>
        This is a div <span>with a span</span> - how's that?
    </div>
    <div>
        This is a div <span>with a span</span> - how's that?
    </div>
</body>
</html>
